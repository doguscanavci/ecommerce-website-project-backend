server.port=8080

spring.application.name=ecommerce-backend

# ==================== DATABASE ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=postgres1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==================== MAIL (account activation) ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== APP-SPECIFIC ====================
# 256-bit (32+ char) secret required for HS256 - CHANGE THIS IN PRODUCTION
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandom1234567890
app.jwt.expiration-ms=604800000

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.frontend.activation-url=http://localhost:5173/activate